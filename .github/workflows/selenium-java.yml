name: Selenium Tests (Java)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/java/**'
      - '.github/workflows/selenium-java.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/java/**'
      - '.github/workflows/selenium-java.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn -T 1C test -Dheadless=true
        working-directory: ./playwright-tests/java
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce
          # Tighten timeouts for CI: most tests complete in <10s locally;
          # 30s gives generous headroom for a 2x-3x CI slowdown while failing
          # faster (vs the 90s default) if a test truly hangs.
          SAUCE_DEMO_TIMEOUT: 30
          SAUCE_DEMO_NAVIGATION_TIMEOUT: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: playwright-tests/java/target/surefire-reports/
          retention-days: 30
          if-no-files-found: ignore