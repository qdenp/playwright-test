name: Playwright Tests (Python)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/python/**'
      - '.github/workflows/playwright-python.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/python/**'
      - '.github/workflows/playwright-python.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: py-lint-${{ runner.os }}-${{ hashFiles('playwright-tests/python/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt flake8 black
        working-directory: ./playwright-tests/python

      - name: Run flake8
        run: flake8 tests/ --max-line-length=120 --ignore=E501,W503,F401,F841,E402
        working-directory: ./playwright-tests/python

      - name: Run black check
        run: black --check tests/
        working-directory: ./playwright-tests/python

  test-chromium:
    name: Tests (Chromium)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        id: cache-pip-deps
        with:
          path: ~/.cache/pip
          key: py-deps-${{ runner.os }}-${{ hashFiles('playwright-tests/python/requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browser
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: py-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/python/requirements.txt') }}

      - name: Install dependencies
        if: steps.cache-pip-deps.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
        working-directory: ./playwright-tests/python

      - name: Install Playwright browsers
        if: steps.cache-browser.outputs.cache-hit != 'true'
        run: playwright install --with-deps
        working-directory: ./playwright-tests/python

      - name: Create playwright-report directory
        run: mkdir -p playwright-report
        working-directory: ./playwright-tests/python

      - name: Run pytest on Chromium
        run: python -m pytest tests/e2e/ -v --tb=short --reruns 3 --reruns-delay 1
        working-directory: ./playwright-tests/python
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload Chromium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-chromium
          path: playwright-tests/python/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  test-full:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test-chromium
    if: success() || failure()
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: py-deps-${{ runner.os }}-${{ hashFiles('playwright-tests/python/requirements.txt') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: py-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/python/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./playwright-tests/python
        if: steps.cache-pip-deps.outputs.cache-hit != 'true'

      - name: Install Playwright browsers
        run: playwright install --with-deps
        working-directory: ./playwright-tests/python
        if: steps.cache-browser.outputs.cache-hit != 'true'

      - name: Create playwright-report directory
        run: mkdir -p playwright-report
        working-directory: ./playwright-tests/python

      - name: Run pytest on ${{ matrix.browser }}
        run: python -m pytest tests/e2e/ -v --tb=short --reruns 3 --reruns-delay 1
        working-directory: ./playwright-tests/python
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload ${{ matrix.browser }} test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.browser }}
          path: playwright-tests/python/playwright-report/
          retention-days: 30
          if-no-files-found: ignore
