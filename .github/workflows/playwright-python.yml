name: Playwright Tests (Python)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./playwright-tests/python

      - name: Install Playwright browsers
        run: playwright install --with-deps
        working-directory: ./playwright-tests/python

      - name: Run pytest
        run: pytest tests/e2e/ -v --tb=short
        working-directory: ./playwright-tests/python
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-report-${{ matrix.browser }}
          path: playwright-tests/python/reports/
          retention-days: 7
