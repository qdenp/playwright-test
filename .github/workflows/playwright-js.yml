name: Playwright Tests (JS)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/js/**'
      - '.github/workflows/playwright-js.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/js/**'
      - '.github/workflows/playwright-js.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install
        working-directory: ./playwright-tests/js

      - name: Run ESLint
        run: npx eslint tests/ --max-warnings=0
        working-directory: ./playwright-tests/js
        continue-on-error: true

  test-chromium:
    name: Tests (Chromium)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node
        with:
          path: playwright-tests/js/node_modules
          key: js-node-${{ runner.os }}-${{ hashFiles('playwright-tests/js/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browser
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: js-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/js/package.json') }}

      - name: Install dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./playwright-tests/js

      - name: Install Playwright browsers
        if: steps.cache-browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
        working-directory: ./playwright-tests/js

      - name: Run Playwright tests on Chromium
        run: npx playwright test --project=chromium --reporter=list
        working-directory: ./playwright-tests/js
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload Chromium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-tests/js/test-results/
            playwright-tests/js/reports/
          retention-days: 30
          if-no-files-found: ignore

  test-full:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test-chromium
    if: success() || failure()
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: playwright-tests/js/node_modules
          key: js-node-${{ runner.os }}-${{ hashFiles('playwright-tests/js/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: js-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/js/package.json') }}

      - name: Install dependencies
        run: npm install
        working-directory: ./playwright-tests/js
        if: steps.cache-node.outputs.cache-hit != 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ./playwright-tests/js
        if: steps.cache-browser.outputs.cache-hit != 'true'

      - name: Run Playwright tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }} --reporter=list
        working-directory: ./playwright-tests/js
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload ${{ matrix.browser }} test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-tests/js/test-results/
            playwright-tests/js/reports/
          retention-days: 30
          if-no-files-found: ignore
