name: Playwright Tests (C#)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/csharp/**'
      - '.github/workflows/playwright-csharp.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/csharp/**'
      - '.github/workflows/playwright-csharp.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./playwright-tests/csharp/PlaywrightTests

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./playwright-tests/csharp/PlaywrightTests

  test:
    name: Tests (Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browser
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: csharp-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/csharp/PlaywrightTests/PlaywrightTests.csproj') }}

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./playwright-tests/csharp/PlaywrightTests

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./playwright-tests/csharp/PlaywrightTests

      - name: Install Playwright CLI
        run: dotnet tool install --global Microsoft.Playwright.CLI
        working-directory: ./playwright-tests/csharp/PlaywrightTests

      - name: Install Playwright browsers
        if: steps.cache-browser.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
        working-directory: ./playwright-tests/csharp/PlaywrightTests

      - name: Run tests
        run: dotnet test --no-build
        working-directory: ./playwright-tests/csharp/PlaywrightTests
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: playwright-tests/csharp/PlaywrightTests/TestResults/
          retention-days: 30
          if-no-files-found: ignore