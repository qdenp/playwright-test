name: Playwright Tests (Java)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/java-playwright/**'
      - '.github/workflows/playwright-java.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'playwright-tests/java-playwright/**'
      - '.github/workflows/playwright-java.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: java-playwright-maven-${{ runner.os }}-${{ hashFiles('playwright-tests/java-playwright/pom.xml') }}
          restore-keys: |
            java-playwright-maven-${{ runner.os }}-

      - name: Build
        run: mvn compile -DskipTests
        working-directory: ./playwright-tests/java-playwright

  test:
    name: Tests (Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: java-playwright-maven-${{ runner.os }}-${{ hashFiles('playwright-tests/java-playwright/pom.xml') }}
          restore-keys: |
            java-playwright-maven-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browser
        with:
          path: ~/.cache/ms-playwright
          key: java-playwright-browser-${{ runner.os }}-${{ hashFiles('playwright-tests/java-playwright/pom.xml') }}

      - name: Install Playwright browsers
        if: steps.cache-browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: ./playwright-tests/java-playwright

      - name: Run Maven tests
        run: mvn test
        working-directory: ./playwright-tests/java-playwright
        env:
          SAUCE_DEMO_USERNAME: standard_user
          SAUCE_DEMO_PASSWORD: secret_sauce
          SAUCE_DEMO_PASSWORDS: standard_user:secret_sauce,problem_user:secret_sauce,performance_glitch_user:secret_sauce,error_user:secret_sauce,visual_user:secret_sauce,locked_out_user:secret_sauce

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-playwright-test-results
          path: playwright-tests/java-playwright/target/surefire-reports/
          retention-days: 30
          if-no-files-found: ignore
