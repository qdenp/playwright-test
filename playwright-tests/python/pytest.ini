[pytest]
testpaths = tests
python_files = test*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=playwright-report/report.html
    --self-contained-html
    --base-url=https://qdenp.github.io/playwright-test/
    --reruns 3
    --reruns-delay 1
pythonpath = tests

flake8_exclude =
    __pycache__
    .venv
    venv